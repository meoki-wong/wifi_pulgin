name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
      - dev-0131
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows executable
        run: npx pkg . --targets node18-win-x64 --output dist/resource-consumer-server.exe
      
      - name: Create Windows start script
        shell: cmd
        run: |
          (
            echo @echo off
            echo title Resource Consumer Server
            echo echo Starting Resource Consumer Server...
            echo echo.
            echo dist\resource-consumer-server.exe
            echo pause
          ) > start.bat
      
      - name: Create Windows stop script
        shell: cmd
        run: |
          (
            echo @echo off
            echo title Stop Resource Consumer Server
            echo echo Stopping Resource Consumer Server...
            echo taskkill /F /IM resource-consumer-server.exe 2^>nul
            echo if %%errorlevel%% equ 0 ^(
            echo     echo Server stopped successfully.
            echo ^) else ^(
            echo     echo Server is not running or already stopped.
            echo ^)
            echo echo.
            echo pause
          ) > stop.bat
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/resource-consumer-server.exe
            start.bat
            stop.bat
          retention-days: 90
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/resource-consumer-server.exe
            start.bat
            stop.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}