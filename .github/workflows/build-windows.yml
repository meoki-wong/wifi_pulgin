name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
      - dev-0131
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows executable
        run: npx pkg . --targets node18-win-x64 --output dist/resource-consumer-server.exe
      
      - name: Create Windows start script
        run: |
          @echo off > start.bat
          echo @echo off >> start.bat
          echo title Resource Consumer Server >> start.bat
          echo echo Starting Resource Consumer Server... >> start.bat
          echo echo. >> start.bat
          echo dist\resource-consumer-server.exe >> start.bat
          echo pause >> start.bat
      
      - name: Create Windows stop script
        run: |
          @echo off > stop.bat
          echo @echo off >> stop.bat
          echo title Stop Resource Consumer Server >> stop.bat
          echo echo Stopping Resource Consumer Server... >> stop.bat
          echo taskkill /F /IM resource-consumer-server.exe >> stop.bat
          echo echo Server stopped. >> stop.bat
          echo pause >> stop.bat
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/resource-consumer-server.exe
            start.bat
            stop.bat
          retention-days: 90
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/resource-consumer-server.exe
            start.bat
            stop.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}