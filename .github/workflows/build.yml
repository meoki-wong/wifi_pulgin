name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pkg
        run: npm install -g pkg

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: pkg . --targets node18-win-x64 --outpath build
        env:
          PKG_EXECPATH: ${{ env.npm_config_prefix }}/pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resource-consumer-server-windows
          path: build/
          retention-days: 7

      - name: Show result
        run: |
          echo "Build successful!"
          echo "Files:"
          dir build\
